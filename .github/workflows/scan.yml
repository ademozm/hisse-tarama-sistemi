name: Otomatik Hisse/Kripto Taraması

# Bu dosya, GitHub'ın ÜCRETSİZ sunucularında sistemi otomatik ve
# düzenli olarak çalıştırır — bilgisayarın kapalı olsa bile.
#
# Kurulum adımları README.md > "Bulutta Ücretsiz 7/24 Çalıştırma"
# bölümünde detaylı anlatılıyor. Özetle:
#   1. Bu projeyi bir GitHub deposuna (repository) yükle.
#   2. Repo Settings > Secrets and variables > Actions altına
#      TELEGRAM_BOT_TOKEN ve TELEGRAM_CHAT_ID ekle (bildirim istiyorsan).
#   3. Repo Settings > Actions > General > "Read and write permissions" seç
#      (raporun repoya otomatik kaydedilebilmesi için).
#   4. Bu dosya otomatik devreye girer, aşağıdaki saatlerde çalışır.

on:
  schedule:
    # UTC saatleriyle yazılır. Aşağıdaki, Türkiye saatiyle (UTC+3)
    # yaklaşık 10:30, 13:00, 16:00, 19:00'a denk gelir.
    # Hafta içi (Pazartesi-Cuma) çalışır — piyasalar zaten hafta sonu kapalı.
    - cron: "30 7 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:  # "Actions" sekmesinden elle de tetiklenebilir

permissions:
  contents: write  # Raporu repoya commit edebilmek için

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_scan.py --markets us bist crypto gold

      - name: Raporu iş çıktısı (artifact) olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: tarama-raporu-${{ github.run_id }}
          path: reports/*.xlsx
          retention-days: 30

      - name: Sinyal günlüğünü ve raporu depoya kaydet
        run: |
          git config user.name "Otomatik Tarama Botu"
          git config user.email "action@github.com"
          git add data/signal_journal.db reports/*.xlsx || true
          git diff --staged --quiet || git commit -m "Otomatik tarama: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
