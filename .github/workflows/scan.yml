name: Otomatik Hisse/Kripto Taraması

on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_scan.py --markets us bist crypto

      - name: Raporu iş çıktısı (artifact) olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: tarama-raporu-${{ github.run_id }}
          path: reports/*.xlsx
          retention-days: 30

      - name: Sinyal günlüğünü ve raporu depoya kaydet
        run: |
          git config user.name "Otomatik Tarama Botu"
          git config user.email "action@github.com"
          git add data/signal_journal.db reports/*.xlsx || true
          git diff --staged --quiet || git commit -m "Otomatik tarama: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
